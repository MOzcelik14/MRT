<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E2E" />
      <stop offset="100%" stop-color="#11111B" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="stGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="stGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="stGrad3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Squircle Canvas with Drop Shadow -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" filter="url(#shadow)" />

  <!-- Studio Geometric Monogram -->
  <g transform="translate(14, 16) scale(0.78)">
    <path d="M 24 104 L 24 32 L 48 24 L 48 96 Z" fill="url(#stGrad1)" />
    <path d="M 48 24 L 64 62 L 64 86 L 48 48 Z" fill="#1D4ED8" opacity="0.9" />
    <path d="M 64 62 L 80 24 L 80 48 L 64 86 Z" fill="url(#stGrad2)" />
    <path d="M 80 24 L 104 32 L 104 104 L 80 96 Z" fill="url(#stGrad2)" />
    <polygon points="64,30 76,52 64,74 52,52" fill="url(#stGrad3)" />
  </g>
</svg>
